# Backeddy Server — gerado pelo install.sh. Edições manuais serão sobrescritas.
[global]
   server string = @NAME@
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2_10
   disable netbios = yes
   # o anúncio na rede é feito pelo Avahi (config/backeddy.service)
   multicast dns register = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000
   use sendfile = yes

   # Compatibilidade com macOS (Time Machine, metadados, nomes de arquivo)
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = TimeCapsule8,119
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[TimeMachine]
   comment = Time Machine
   path = @DATA@/timemachine
   valid users = backeddy
   force user = backeddy
   read only = no
   browseable = yes
   inherit permissions = yes
   fruit:time machine = yes
   fruit:time machine max size = @TM_MAX@
   # handles duráveis: o Mac retoma o backup após quedas de rede curtas
   durable handles = yes
   kernel oplocks = no
   kernel share modes = no
   posix locking = no
